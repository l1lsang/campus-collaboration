project_id = "campus-collaboration-platform"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://127.0.0.1:4173/auth/callback", "http://localhost:5173/auth/callback"]
enable_signup = true

[auth.email]
enabled = false
enable_confirmations = true
double_confirm_changes = true
max_frequency = "2s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Campus Collaboration Platform 로그인 인증 코드"
content_path = "./supabase/templates/email-otp.html"

[auth.email.template.confirmation]
subject = "Campus Collaboration Platform 가입 인증 코드"
content_path = "./supabase/templates/email-otp.html"
